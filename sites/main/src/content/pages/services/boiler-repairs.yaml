updatedAt: 2026-10-19
blocks:
  - blockType: hero
    title: Online security and hacking protection
    lead: "Worried someone could get into your accounts or systems? Our ethical hackers look for the weak spots first, explain them in plain words, and help you close them."
    buttons:
      - label: Book a check
        href: /contact
    points:
      - Protection from online attacks
      - Finding weak spots before attackers do
      - Honest, plain-English advice
      - Help closing the gaps we find

  - blockType: split
    title: What's included
    body: |
      Online attacks can cost you money, data and time. Our ethical hackers test your systems the way an attacker would, so problems can be found and fixed before someone else finds them.

      If you think you've already been hacked, or you've noticed something odd, tell us what happened. We'll look into it, explain what we find, and tell you what to do next.
    bullets:
      - Security checks of your systems and accounts
      - Testing for weak points and gaps
      - A clear summary of what we found
      - Advice on protecting your accounts and devices

  - blockType: faq
    tone: white
    title: Questions about online security
    items:
      - question: How often should my systems be checked?
        answer: Regular checks are a good idea, and worth doing whenever you add or change important systems. We can talk through what suits your business.
      - question: Is it worth fixing a weak spot we already know about?
        answer: Usually, yes. We'll explain the risk and what fixing it involves, so you can decide what to act on first.

  - blockType: cta
    title: Book a security check
    text: Tell us about your systems and any problems you've noticed, and we'll get back to you.
    buttons:
      - label: Contact us
        href: /contact
