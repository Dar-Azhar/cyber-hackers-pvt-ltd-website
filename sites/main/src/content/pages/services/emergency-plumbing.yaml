title: "Emergency cyber security"
seo:
  title: "Emergency cyber security Bengaluru | Cyber Hackers Pvt Ltd"
  description: "Think you've been hacked in Bengaluru? Call Cyber Hackers Pvt Ltd, a team of ethical hackers, and tell us what's happening."
updatedAt: 2026-10-19
blocks:
  - blockType: hero
    title: Emergency cyber security
    lead: "Think someone has got into your accounts or devices? Get in touch and tell us what's happening."
    buttons:
      - label: Contact us now
        href: /contact
    points:
      - Hacked email and social media accounts
      - Suspicious activity on your devices
      - Malware and ransomware
      - Stolen or leaked personal data

  - blockType: split
    title: While you wait for us
    body: |
      If you think someone is in your accounts, change your passwords from a device you trust, not the one that may be affected.

      If a device is behaving strangely, disconnect it from the internet until you've spoken to us. Don't delete anything yet, as it may help us understand what happened.
    highlight:
      title: Quick checklist
      items:
        - Disconnect the affected device from the internet
        - Change your passwords from a device you trust
        - Turn on two-factor authentication where you can
        - Take a screenshot of anything suspicious

  - blockType: cta
    title: Think you've been hacked?
    text: Get in touch and tell us what's happening. We'll get back to you as soon as we can.
    buttons:
      - label: Contact us
        href: /contact
