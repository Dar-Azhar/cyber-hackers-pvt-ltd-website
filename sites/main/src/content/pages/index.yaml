  - blockType: split
    tone: white
    eyebrow: Why choose us
    title: "A local team that treats your security like our own"
    body: |
      We're a small, local team, so the person who looks at your systems is the person who answers when you have a question.

      We explain what we find and why, in plain English, and we never make changes without asking you first.
    highlight:
      title: What you can expect
      items:
        - A clear written summary of what we found
        - A plain-English explanation of each risk
        - No changes made without your agreement
        - Reports and follow-up sent by email

  - blockType: steps
    eyebrow: How it works
    title: From your first call to a more secure system
    steps:
      - title: Tell us what you need
        text: Call, email or use the form. Tell us which systems or accounts you're worried about.
      - title: Get a clear plan
        text: We discuss what needs checking and send you the plan in writing.
      - title: We do the work
        text: On the day we agree, we get on with it and keep you posted as we go.
      - title: Check and sign off
        text: We walk you through what we found and what to fix next.

