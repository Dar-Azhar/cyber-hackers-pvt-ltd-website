title: "About us"
seo:
  title: "About Cyber Hackers Pvt Ltd | Ethical Hackers in Bengaluru"
  description: "Who we are and how we work: Cyber Hackers Pvt Ltd is a team of ethical hackers in Bengaluru, protecting you from online hacking."
updatedAt: 2026-10-19
blocks:
  - blockType: hero
    title: "About Cyber Hackers Pvt Ltd"
    lead: "A Bengaluru team of ethical hackers, working to keep you safe online."

  - blockType: split
    title: Our story
    body: |
      Cyber Hackers Pvt Ltd is a team of ethical hackers based in Bengaluru. We protect people and businesses from online hacking by looking for weak spots before someone with bad intentions finds them.

      We think like an attacker so that we can close the gaps first. We enjoy the detail of the work and we like explaining what we find in plain language.
    highlight:
      title: In short
      items:
        - Local to Bengaluru
        - Ethical hackers
        - Plain-English advice

  - blockType: features
    tone: white
    title: How we work
    items:
      - icon: MessageCircle
        title: We explain things
        text: You'll know what we're doing and why, before we do it.
      - icon: Clock
        title: We respond quickly
        text: If we spot a risk or something changes, we call you, not the other way round.
      - icon: Sparkles
        title: We leave you a clear record
        text: You'll get a summary of what we checked, what we found and what we changed.

  - blockType: cta
    title: Talk to us about your security
    text: We're happy to give advice, even if you only have a quick question.
    buttons:
      - label: Get in touch
        href: /contact
